<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hello Evance</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #101827;
        color: #f8fafc;
      }

      * { box-sizing: border-box; }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        overflow: hidden;
        background:
          radial-gradient(circle at 15% 20%, rgba(99, 102, 241, .42), transparent 31rem),
          radial-gradient(circle at 85% 85%, rgba(16, 185, 129, .28), transparent 28rem),
          #101827;
      }

      .orb {
        position: fixed;
        width: 22rem;
        height: 22rem;
        border-radius: 50%;
        filter: blur(4px);
        opacity: .35;
        pointer-events: none;
      }
      .orb-one { top: -9rem; right: -5rem; background: #7c3aed; }
      .orb-two { bottom: -12rem; left: -7rem; background: #0891b2; }

      main {
        width: min(100% - 2rem, 62rem);
        min-height: 38rem;
        display: grid;
        grid-template-columns: 1.05fr .95fr;
        position: relative;
        border: 1px solid rgba(255,255,255,.15);
        border-radius: 1.5rem;
        overflow: hidden;
        background: rgba(15, 23, 42, .75);
        box-shadow: 0 2rem 5rem rgba(0, 0, 0, .38);
        backdrop-filter: blur(18px);
      }

      .intro {
        padding: clamp(2.5rem, 6vw, 5.5rem);
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        background: linear-gradient(145deg, rgba(79, 70, 229, .9), rgba(30, 41, 59, .3));
      }

      .mark {
        display: inline-grid;
        place-items: center;
        width: 2.8rem;
        aspect-ratio: 1;
        border-radius: .85rem;
        background: #fff;
        color: #4f46e5;
        font-size: 1.45rem;
        font-weight: 900;
      }

      .intro h1 { margin: 0; max-width: 10ch; font-size: clamp(2.25rem, 4vw, 3.7rem); line-height: 1.03; letter-spacing: -.055em; }
      .intro p { margin: 1.2rem 0 0; max-width: 31ch; color: #e0e7ff; line-height: 1.65; }
      .quote { color: #c7d2fe; font-size: .9rem; }

      .login { padding: clamp(2rem, 5vw, 4.5rem); display: flex; flex-direction: column; justify-content: center; }
      .login h2 { margin: 0; font-size: 1.8rem; letter-spacing: -.035em; }
      .subtitle { margin: .55rem 0 2rem; color: #94a3b8; font-size: .95rem; }
      .subtitle a, .signup a { color: #a5b4fc; text-decoration: none; font-weight: 700; }
      .subtitle a:hover, .signup a:hover { text-decoration: underline; }

      form { display: grid; gap: 1.1rem; }
      label { display: grid; gap: .5rem; font-size: .87rem; font-weight: 650; color: #e2e8f0; }
      input {
        width: 100%;
        padding: .9rem 1rem;
        border: 1px solid #334155;
        border-radius: .7rem;
        outline: 0;
        background: rgba(15, 23, 42, .75);
        color: #fff;
        font: inherit;
        transition: border-color .2s, box-shadow .2s;
      }
      input::placeholder { color: #64748b; }
      input:focus { border-color: #818cf8; box-shadow: 0 0 0 4px rgba(129, 140, 248, .16); }

      .options { display: flex; justify-content: space-between; align-items: center; gap: 1rem; font-size: .83rem; }
      .remember { display: flex; align-items: center; gap: .45rem; color: #cbd5e1; }
      .remember input { width: 1rem; height: 1rem; accent-color: #818cf8; }
      .forgot { color: #a5b4fc; text-decoration: none; font-weight: 650; }
      button { border: 0; border-radius: .7rem; padding: .95rem 1rem; background: #818cf8; color: #111827; font: inherit; font-weight: 800; cursor: pointer; transition: transform .2s, background .2s; }
      button:hover { background: #a5b4fc; transform: translateY(-1px); }
      .signup { margin: 1.8rem 0 0; text-align: center; color: #94a3b8; font-size: .87rem; }

      @media (max-width: 700px) {
        body { overflow: auto; padding: 1rem 0; }
        main { grid-template-columns: 1fr; min-height: auto; }
        .intro { min-height: 16rem; padding: 2.5rem; }
        .intro h1 { margin-top: 3rem; font-size: 2.4rem; }
        .quote { display: none; }
      }
    </style>
  </head>
  <body>
    <div class="orb orb-one"></div>
    <div class="orb orb-two"></div>
    <main>
      <section class="intro" aria-label="Welcome">
        <div>
          <span class="mark" aria-hidden="true">N</span>
          <h1>Good things start here.</h1>
          <p>A calmer, clearer home for the work that matters most.</p>
        </div>
        <span class="quote">Designed for focus. Built for momentum.</span>
      </section>
      <section class="login" aria-labelledby="login-heading">
        <h2 id="login-heading">Welcome back, Evance!</h2>
        <p class="subtitle">New here? <a href="#signup">Create an account</a></p>
        <form action="#" method="post">
          <label>Email address
            <input type="email" name="email" placeholder="you@example.com" autocomplete="email" required />
          </label>
          <label>Password
            <input type="password" name="password" placeholder="Enter your password" autocomplete="current-password" required />
          </label>
          <div class="options">
            <label class="remember"><input type="checkbox" name="remember" /> Remember me</label>
            <a class="forgot" href="#reset">Forgot password?</a>
          </div>
          <button type="submit">Sign in</button>
        </form>
        <p class="signup" id="signup">Protected with industry-standard security.</p>
      </section>
    </main>
  </body>
</html>
